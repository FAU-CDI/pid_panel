[tool.poetry]
name = "pid-customer-system"
version = "0.1.0"
description = "Django application for QuickPID customer management and API access."
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
django = "^6.0"
djangorestframework = "^3.17"
requests = "^2.34"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "django-stubs[compatible-mypy] (>=6.0.6,<7.0.0)",
    "djangorestframework-stubs[compatible-mypy] (>=3.17.0,<4.0.0)"
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "pidproject.settings"