[tool.poetry]
name = "pid-customer-system"
version = "0.1.0"
description = "Django application for QuickPID customer management and API access."
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
django = "^6.0"
djangorestframework = "^3.17"
requests = "^2.34"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)"
]
