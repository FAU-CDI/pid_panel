services:

  django:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

      GO_BACKEND_URL: "http://host.docker.internal:8080"
      GO_BACKEND_TOKEN: "${GO_BACKEND_TOKEN}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - django