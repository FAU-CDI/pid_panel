{% extends 'base.html' %}

{% block title %}
Create PID | QuickPID
{% endblock %}

{% block content %}

<div class="card">

    <h1>Create PID</h1>

    <p>
        Select a namespace and provide the resource details.
    </p>

    <br>

    <form method="post">

        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label for="namespace">
                <strong>Namespace</strong>
            </label>
            <br><br>

            <select
                name="namespace_id"
                id="namespace"
                style="width:100%; padding:8px;"
                required
            >

                <option value="">
                    Select Namespace
                </option>

                {% for ns in namespaces %}
                <option value="{{ ns.id }}">
                    {{ ns.tag }}
                </option>
                {% endfor %}

            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="url">
                <strong>Resource URL</strong>
            </label>
            <br><br>

            <input
                type="url"
                name="url"
                id="url"
                style="width:100%; padding:8px;"
            >
        </div>

        <div style="margin-bottom: 15px;">
            <label for="metadata">
                <strong>Metadata</strong>
            </label>
            <br><br>

            <textarea
                name="metadata"
                id="metadata"
                rows="6"
                style="width:100%; padding:8px;"
            ></textarea>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="tag">
                <strong>PID Tag</strong>
            </label>
            <br><br>

            <input
                type="text"
                name="tag"
                id="tag"
                style="width:100%; padding:8px;"
            >
        </div>

        <button
            type="submit"
            style="
                background:#2563eb;
                color:white;
                border:none;
                padding:10px 20px;
                border-radius:5px;
                cursor:pointer;
            "
        >
            Create PID
        </button>

    </form>

</div>

{% endblock %}
