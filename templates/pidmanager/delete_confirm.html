{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>Delete PID</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ pid }}</strong>?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Delete
        </button>

        <a href="{% url 'pid_list' namespace_id %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
