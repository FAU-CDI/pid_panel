{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h1>Select Namespace</h1>

    <br>

    <ul>

        {% for ns in namespaces %}

        <li>

            <a href="{% url 'pid_list' ns.id %}">
                {{ ns.tag }}
            </a>

        </li>

        {% endfor %}

    </ul>

</div>

{% endblock %}
