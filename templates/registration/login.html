{% extends 'base.html' %}

{% block title %}
Login | QuickPID
{% endblock %}

{% block content %}

<div style="max-width: 400px; margin: 60px auto;">

    <div class="card">

        <h2>QuickPID Login</h2>

        <br>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                style="
                    width:100%;
                    background:#2563eb;
                    color:white;
                    border:none;
                    padding:10px;
                    border-radius:5px;
                    cursor:pointer;
                "
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
